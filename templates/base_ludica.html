<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}Sessão Lúdica - LB-PRT{% endblock %}</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Quicksand:wght@300..700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f4f4f2",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#3c3161",
                        "on-secondary-container": "#2e5b80",
                        "on-background": "#1a1c1b",
                        "surface-bright": "#f9f9f7",
                        "outline": "#6f7973",
                        "on-secondary-fixed-variant": "#194a6e",
                        "background": "#f9f9f7",
                        "on-secondary-fixed": "#001d32",
                        "tertiary-fixed-dim": "#cdbef9",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#e8ddff",
                        "on-primary-fixed-variant": "#00513a",
                        "surface-container-highest": "#e2e3e1",
                        "surface-variant": "#e2e3e1",
                        "primary-fixed-dim": "#8fd5b6",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#3f4944",
                        "tertiary": "#63578a",
                        "primary-container": "#6baf92",
                        "secondary-fixed": "#cde5ff",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2f3130",
                        "surface-dim": "#dadad8",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#4b3f70",
                        "outline-variant": "#bfc9c2",
                        "surface-tint": "#246a51",
                        "secondary-container": "#a8d3fe",
                        "secondary": "#356287",
                        "secondary-fixed-dim": "#a0cbf5",
                        "surface": "#f9f9f7",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f1f1ef",
                        "primary": "#246a51",
                        "on-tertiary-fixed": "#1f1242",
                        "on-primary-container": "#00412e",
                        "tertiary-container": "#a89ad2",
                        "on-primary-fixed": "#002115",
                        "primary-fixed": "#abf1d1",
                        "on-surface": "#1a1c1b",
                        "surface-container-high": "#e8e8e6",
                        "inverse-primary": "#8fd5b6",
                        "surface-container": "#eeeeec"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-lg": "48px",
                        "stack-sm": "12px",
                        "stack-md": "24px",
                        "gutter": "20px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Quicksand"],
                        "body-lg": ["Nunito Sans"],
                        "label-md": ["Nunito Sans"],
                        "title-md": ["Quicksand"],
                        "display-lg": ["Quicksand"],
                        "headline-lg": ["Quicksand"],
                        "body-md": ["Nunito Sans"]
                    }
                }
            }
        }
</script>
<style>
    body {
        background-color: #f9f9f7; /* background */
        color: #1a1c1b; /* on-background */
    }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col relative w-full max-w-[1200px] mx-auto pb-24 md:pb-0">
    <header class="flex justify-between items-center w-full px-container-padding h-16 bg-surface-bright border-b border-outline-variant sticky top-0 z-40 mb-4">
        <div class="flex items-center gap-2">
            <a href="{% url 'crianca_lista' %}" class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high rounded-full p-1 transition-colors" style="text-decoration:none;">arrow_back</a>
            <h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Sessão Atual</h1>
        </div>
    </header>
    {% block conteudo %}{% endblock %}
</body>
</html>
