<style>
/* Base Game Styles — paleta Clinical Softness (docs/design-system.md) */
.game-grid {
    display: inline-grid;
    gap: 4px;
    background: var(--color-surface-container-low);
    padding: 10px;
    border-radius: var(--radius-card);
}

.game-cell {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-surface);
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
    border: 1px solid var(--color-border);
}

.game-cell.selected {
    background: var(--color-primary-container);
    color: var(--color-on-primary-container);
    border-color: var(--color-primary);
}

.game-cell.found {
    background: var(--color-tertiary-container);
    color: var(--color-on-tertiary-container);
    border-color: var(--color-tertiary);
}

/* Crossword */
.crossword-grid { position: relative; background: transparent; padding: 0; }
.crossword-input {
    width: 100%; height: 100%; text-align: center; font-size: 1.1rem; font-weight: 700;
    border: none; outline: none; background: transparent; text-transform: uppercase;
}
.crossword-input:focus { background: rgba(53, 98, 135, 0.1); }
.crossword-cell-wrapper {
    position: absolute; width: 40px; height: 40px; background: var(--color-surface);
    border: 1px solid var(--color-outline); display: flex; align-items: center; justify-content: center;
}
.crossword-number { position: absolute; top: 2px; left: 2px; font-size: 0.6rem; line-height: 1; color: var(--color-text-muted); }

/* Unscramble */
.unscramble-row { display: flex; gap: 5px; margin-bottom: 10px; }
.unscramble-input {
    width: 40px; height: 40px; text-align: center; font-size: 1.1rem; font-weight: 700;
    border: 2px solid var(--color-border); border-radius: 6px; text-transform: uppercase;
}
.unscramble-input.shaded { background: var(--color-surface-container-high); }

/* Phrases fill */
.phrase-input {
    display: inline-block; width: 150px; border: none; border-bottom: 2px solid var(--color-secondary);
    background: transparent; text-align: center; font-weight: 700; outline: none; color: var(--color-secondary);
}
.phrase-input:focus { border-bottom-color: var(--color-primary); }

/* Card do exercício — cabeçalho centralizado, no espírito do protótipo Stitch */
.exercicio-card { max-width: 720px; margin: 0 auto; }
.exercicio-card .exercicio-icone {
    width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--color-tertiary-container); color: var(--color-on-tertiary-container); margin: 0 auto 1rem;
}
.exercicio-card h4 { text-align: center; }
.exercicio-card .enunciado-texto { text-align: center; max-width: 560px; margin: 0 auto 1.5rem; }
</style>

<script>
function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match.pop()) : null;
}

// Estado local dos resultados — nada é enviado ao servidor até o clique em "Enviar sessão" (issue #28).
const resultadosLocais = {};
const cardsPorExercicioId = {};

function registrarResultadoLocal(ex, { percentual, pontuacao, tempoInicio, respostas }) {
    const anterior = resultadosLocais[ex.id];
    resultadosLocais[ex.id] = {
        exercicio_id: ex.id,
        percentual_acerto: percentual,
        pontuacao: pontuacao,
        tempo_segundos: Math.max(0, Math.round((Date.now() - tempoInicio) / 1000)),
        tentativas: anterior ? anterior.tentativas + 1 : 1,
        respostas: respostas || {},
    };
    const card = cardsPorExercicioId[ex.id];
    if (card) card.classList.remove('com-erro');
    atualizarProgresso();
}

function atualizarProgresso() {
    const total = Object.keys(cardsPorExercicioId).length;
    const feitos = Object.keys(resultadosLocais).length;
    const progressoTexto = document.getElementById('progresso-texto');
    const progressoBarra = document.getElementById('progresso-barra');
    if (progressoTexto) progressoTexto.innerText = `${feitos}/${total}`;
    if (progressoBarra) progressoBarra.style.width = `${total ? Math.round((feitos / total) * 100) : 0}%`;
}

function criarBotaoVoltar(container) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-outline-primary mt-3';
    btn.innerText = 'Voltar para os exercícios';
    btn.onclick = () => history.back();
    container.appendChild(btn);
    return btn;
}

const ExerciseRenderers = {
    // 1. Lacunas com letras
    preenche_lacunas_letras: function(container, ex) {
        const config = ex.configuracao;
        const tempoInicio = Date.now();

        const gridContainer = document.createElement('div');
        gridContainer.className = "game-grid mb-4";
        gridContainer.style.gridTemplateColumns = `repeat(${config.grid[0].length}, 40px)`;

        let isDragging = false;

        config.grid.forEach((row, rowIndex) => {
            row.forEach((letter, colIndex) => {
                const cell = document.createElement('div');
                cell.className = "game-cell";
                cell.innerText = letter;
                cell.dataset.r = rowIndex;
                cell.dataset.c = colIndex;

                cell.addEventListener('mousedown', () => { isDragging = true; cell.classList.toggle('selected'); });
                cell.addEventListener('mouseenter', () => { if(isDragging) cell.classList.toggle('selected'); });

                gridContainer.appendChild(cell);
            });
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        container.appendChild(gridContainer);

        const phrasesContainer = document.createElement('div');
        (config.frases || []).forEach((fraseTemplate) => {
            const p = document.createElement('p');
            p.innerHTML = fraseTemplate.replace(/\{(\d+)\}/g, `<input type="text" class="phrase-input" data-answer-idx="$1" />`);
            phrasesContainer.appendChild(p);
        });
        container.appendChild(phrasesContainer);

        const btn = document.createElement('button');
        btn.className = "btn btn-coral mt-3";
        btn.innerText = "Verificar Respostas";
        btn.onclick = () => {
            let corretas = 0;
            const inputs = phrasesContainer.querySelectorAll('.phrase-input');
            inputs.forEach(input => {
                const answer = (config.respostas || [])[input.dataset.answerIdx];
                const acertou = answer && input.value.toUpperCase() === answer.toUpperCase();
                input.style.borderBottomColor = acertou ? "var(--color-primary)" : "var(--color-error)";
                input.style.color = acertou ? "var(--color-primary)" : "var(--color-text)";
                if (acertou) corretas++;
            });
            const total = inputs.length || 1;
            const percentual = Math.round((corretas / total) * 100);
            const respostas = Array.from(inputs).map(input => input.value);
            btn.innerText = "Verificar novamente";
            registrarResultadoLocal(ex, { percentual, pontuacao: percentual, tempoInicio, respostas: { valores: respostas } });
        };
        container.appendChild(btn);
    },

    // 2. Cruzadinha
    cruzadinha: function(container, ex) {
        const config = ex.configuracao;
        const tempoInicio = Date.now();

        let maxX = 0, maxY = 0;
        config.celulas.forEach(c => {
            if (c.x > maxX) maxX = c.x;
            if (c.y > maxY) maxY = c.y;
        });

        const gridWrapper = document.createElement('div');
        gridWrapper.className = "crossword-grid mb-4";
        gridWrapper.style.width = `${(maxX + 1) * 40}px`;
        gridWrapper.style.height = `${(maxY + 1) * 40}px`;

        const editaveis = [];
        config.celulas.forEach(cell => {
            const cellDiv = document.createElement('div');
            cellDiv.className = "crossword-cell-wrapper";
            cellDiv.style.left = `${cell.x * 40}px`;
            cellDiv.style.top = `${cell.y * 40}px`;

            if (cell.numero) {
                const num = document.createElement('span');
                num.className = "crossword-number";
                num.innerText = cell.numero;
                cellDiv.appendChild(num);
            }

            if (cell.editavel) {
                const input = document.createElement('input');
                input.className = "crossword-input";
                input.maxLength = 1;
                cellDiv.appendChild(input);
                editaveis.push(input);
            } else {
                cellDiv.style.background = "var(--color-text)";
            }

            gridWrapper.appendChild(cellDiv);
        });

        container.appendChild(gridWrapper);

        if (config.dicas && config.dicas.length > 0) {
            const dicas = document.createElement('div');
            dicas.className = 'mt-3';
            dicas.innerHTML = "<h6>Dicas:</h6><ul>" + config.dicas.map(d => `<li>${d}</li>`).join('') + "</ul>";
            container.appendChild(dicas);
        }

        const btn = document.createElement('button');
        btn.className = "btn btn-coral mt-3";
        btn.innerText = "Verificar Respostas";
        btn.onclick = () => {
            const preenchidas = editaveis.filter(i => i.value.trim().length > 0).length;
            const total = editaveis.length || 1;
            const percentual = Math.round((preenchidas / total) * 100);
            const respostas = editaveis.map(i => i.value);
            btn.innerText = "Verificar novamente";
            registrarResultadoLocal(ex, { percentual, pontuacao: percentual, tempoInicio, respostas: { valores: respostas } });
        };
        container.appendChild(btn);
    },

    // 3. Caça-palavras
    caca_palavras: function(container, ex) {
        const config = ex.configuracao;
        const tempoInicio = Date.now();

        const gridContainer = document.createElement('div');
        gridContainer.className = "game-grid mb-4";
        gridContainer.style.gridTemplateColumns = `repeat(${config.grid[0].length}, 40px)`;

        let isDragging = false;
        let selecionadas = [];
        const palavrasAlvo = (config.palavras || []).map(w => w.toUpperCase());
        const encontradas = new Set();

        const listaDiv = document.createElement('div');
        listaDiv.className = "mt-3";

        function atualizarLista() {
            listaDiv.innerHTML = "<h6>Encontre:</h6><p>" + palavrasAlvo.map(w =>
                encontradas.has(w) ? `<s>${w}</s>` : w
            ).join(', ') + "</p>";
        }

        function registrarProgresso() {
            const total = palavrasAlvo.length || 1;
            const percentual = Math.round((encontradas.size / total) * 100);
            registrarResultadoLocal(ex, {
                percentual,
                pontuacao: percentual,
                tempoInicio,
                respostas: { palavras_encontradas: Array.from(encontradas) },
            });
        }

        function limparSelecao() {
            selecionadas.forEach(cell => cell.classList.remove('selected'));
            selecionadas = [];
        }

        function verificarSelecao() {
            if (selecionadas.length < 2) { limparSelecao(); return; }

            const coords = selecionadas.map(c => ({ r: Number(c.dataset.r), c: Number(c.dataset.c), el: c }));
            const dr = coords[1].r - coords[0].r;
            const dc = coords[1].c - coords[0].c;
            const passoValido = Math.abs(dr) <= 1 && Math.abs(dc) <= 1 && !(dr === 0 && dc === 0);
            const linhaReta = passoValido && coords.every((p, i) => p.r === coords[0].r + dr * i && p.c === coords[0].c + dc * i);

            if (linhaReta) {
                const palavra = coords.map(p => p.el.innerText).join('');
                const invertida = palavra.split('').reverse().join('');
                const achou = palavrasAlvo.find(w => (w === palavra || w === invertida) && !encontradas.has(w));
                if (achou) {
                    encontradas.add(achou);
                    coords.forEach(p => p.el.classList.add('found'));
                    atualizarLista();
                    registrarProgresso();
                    if (encontradas.size === palavrasAlvo.length) {
                        statusDiv.innerText = "Todas as palavras encontradas!";
                    }
                }
            }
            limparSelecao();
        }

        config.grid.forEach((row, rowIndex) => {
            row.forEach((letter, colIndex) => {
                const cell = document.createElement('div');
                cell.className = "game-cell";
                cell.innerText = letter;
                cell.dataset.r = rowIndex;
                cell.dataset.c = colIndex;

                cell.addEventListener('mousedown', () => {
                    isDragging = true;
                    if (!cell.classList.contains('found')) {
                        cell.classList.add('selected');
                        selecionadas.push(cell);
                    }
                });
                cell.addEventListener('mouseenter', () => {
                    if (isDragging && !selecionadas.includes(cell) && !cell.classList.contains('found')) {
                        cell.classList.add('selected');
                        selecionadas.push(cell);
                    }
                });

                gridContainer.appendChild(cell);
            });
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) { isDragging = false; verificarSelecao(); }
        });

        container.appendChild(gridContainer);

        if (config.frases) {
            const phrasesContainer = document.createElement('div');
            config.frases.forEach((fraseTemplate) => {
                const p = document.createElement('p');
                p.innerHTML = fraseTemplate.replace(/\{(\d+)\}/g, `<input type="text" class="phrase-input" data-answer-idx="$1" />`);
                phrasesContainer.appendChild(p);
            });
            container.appendChild(phrasesContainer);
        }

        if (palavrasAlvo.length > 0) {
            atualizarLista();
            container.appendChild(listaDiv);
        }

        const statusDiv = document.createElement('p');
        statusDiv.className = "text-muted small mt-3 mb-0";
        statusDiv.innerText = "Encontre as palavras arrastando na grade.";
        container.appendChild(statusDiv);
    },

    // 4. Ordene as letras
    ordena_letras: function(container, ex) {
        const config = ex.configuracao;
        const tempoInicio = Date.now();

        const palavraChecks = [];

        config.palavras.forEach(wordObj => {
            const row = document.createElement('div');
            row.className = "unscramble-row d-flex align-items-center";

            const label = document.createElement('div');
            label.className = "me-3 fw-bold";
            label.style.width = "100px";
            label.innerText = wordObj.embaralhada;
            row.appendChild(label);

            const inputs = [];
            for(let i=0; i<wordObj.resposta.length; i++) {
                const input = document.createElement('input');
                input.className = "unscramble-input";
                input.maxLength = 1;
                if (wordObj.sombreadas.includes(i)) {
                    input.classList.add('shaded');
                }
                row.appendChild(input);
                inputs.push(input);

                input.addEventListener('input', function() {
                    if (this.value && this.nextElementSibling && this.nextElementSibling.tagName === 'INPUT') {
                        this.nextElementSibling.focus();
                    }
                });
            }
            container.appendChild(row);
            palavraChecks.push({ inputs, resposta: wordObj.resposta.toUpperCase() });
        });

        if (config.palavra_final) {
            const finalRow = document.createElement('div');
            finalRow.className = "unscramble-row mt-4 p-3 rounded";
            finalRow.style.background = "var(--color-surface-container-low)";
            finalRow.innerHTML = `<strong class="me-3">Palavra Oculta:</strong>`;

            for(let i=0; i<config.palavra_final.length; i++) {
                const input = document.createElement('input');
                input.className = "unscramble-input shaded";
                input.maxLength = 1;
                finalRow.appendChild(input);
            }
            container.appendChild(finalRow);
        }

        const btn = document.createElement('button');
        btn.className = "btn btn-coral mt-3";
        btn.innerText = "Verificar Respostas";
        btn.onclick = () => {
            let corretas = 0;
            palavraChecks.forEach(({ inputs, resposta }) => {
                const digitado = inputs.map(i => i.value.toUpperCase()).join('');
                const acertou = digitado === resposta;
                inputs.forEach(i => { i.style.borderColor = acertou ? "var(--color-primary)" : "var(--color-error)"; });
                if (acertou) corretas++;
            });
            const total = palavraChecks.length || 1;
            const percentual = Math.round((corretas / total) * 100);
            const respostas = palavraChecks.map(({ inputs }) => inputs.map(i => i.value.toUpperCase()).join(''));
            btn.innerText = "Verificar novamente";
            registrarResultadoLocal(ex, { percentual, pontuacao: percentual, tempoInicio, respostas: { palavras: respostas } });
        };
        container.appendChild(btn);
    },

    // 5. Pergunta aberta
    pergunta_aberta: function(container, ex) {
        const config = ex.configuracao;
        const tempoInicio = Date.now();
        const textareas = [];

        (config.itens || []).forEach((item) => {
            const wrapper = document.createElement('div');
            wrapper.className = "mb-3";

            const texto = document.createElement('p');
            texto.className = "mb-2";
            texto.innerHTML = (item.texto || '').replace(/\n/g, '<br>');
            wrapper.appendChild(texto);

            const textarea = document.createElement('textarea');
            textarea.className = "form-control";
            textarea.rows = 2;
            wrapper.appendChild(textarea);

            container.appendChild(wrapper);
            textareas.push(textarea);
        });

        const btn = document.createElement('button');
        btn.className = "btn btn-coral mt-3";
        btn.innerText = "Salvar respostas";
        btn.onclick = () => {
            const respondidos = textareas.filter(t => t.value.trim().length > 0).length;
            const total = textareas.length || 1;
            const percentual = Math.round((respondidos / total) * 100);
            const respostas = textareas.map(t => t.value);
            btn.innerText = "Atualizar respostas";
            registrarResultadoLocal(ex, { percentual, pontuacao: percentual, tempoInicio, respostas: { textos: respostas } });
        };
        container.appendChild(btn);
    },

    // 6. Múltipla escolha
    multipla_escolha: function(container, ex) {
        const config = ex.configuracao;
        const groups = [];
        const tempoInicio = Date.now();

        (config.perguntas || []).forEach((pergunta, qIndex) => {
            const wrapper = document.createElement('div');
            wrapper.className = "mb-4";

            const texto = document.createElement('p');
            texto.className = "mb-2";
            texto.innerHTML = (pergunta.texto || '').replace(/\n/g, '<br>');
            wrapper.appendChild(texto);

            const inputs = [];
            (pergunta.opcoes || []).forEach((opcao, oIndex) => {
                const optWrapper = document.createElement('div');
                optWrapper.className = "form-check";

                const input = document.createElement('input');
                input.type = "radio";
                input.className = "form-check-input";
                input.name = `mc-${ex.id}-${qIndex}`;
                input.value = oIndex;
                input.id = `mc-${ex.id}-${qIndex}-${oIndex}`;

                const label = document.createElement('label');
                label.className = "form-check-label";
                label.setAttribute('for', input.id);
                label.innerText = opcao;

                optWrapper.appendChild(input);
                optWrapper.appendChild(label);
                wrapper.appendChild(optWrapper);
                inputs.push(input);
            });

            container.appendChild(wrapper);
            groups.push({ inputs, correta: pergunta.correta });
        });

        const btn = document.createElement('button');
        btn.className = "btn btn-coral mt-3";
        btn.innerText = "Verificar Respostas";
        btn.onclick = () => {
            let corretas = 0;
            groups.forEach(group => {
                const selected = group.inputs.find(i => i.checked);
                if (!selected) return;
                const acertou = Number(selected.value) === group.correta;
                selected.parentElement.style.color = acertou ? "var(--color-primary)" : "var(--color-error)";
                if (acertou) corretas++;
            });
            const total = groups.length || 1;
            const percentual = Math.round((corretas / total) * 100);
            const respostas = groups.map(group => {
                const selected = group.inputs.find(i => i.checked);
                return selected ? Number(selected.value) : null;
            });
            btn.innerText = "Verificar novamente";
            registrarResultadoLocal(ex, { percentual, pontuacao: percentual, tempoInicio, respostas: { opcoes_selecionadas: respostas } });
        };
        container.appendChild(btn);
    },

    // 7. Verdadeiro ou falso
    verdadeiro_falso: function(container, ex) {
        const config = ex.configuracao;
        const groups = [];
        const tempoInicio = Date.now();

        (config.afirmacoes || []).forEach((afirmacao, aIndex) => {
            const wrapper = document.createElement('div');
            wrapper.className = "mb-3 d-flex align-items-center justify-content-between";

            const texto = document.createElement('span');
            texto.innerText = afirmacao.texto;
            wrapper.appendChild(texto);

            const optsWrapper = document.createElement('div');
            const inputs = {};
            [['V', true], ['F', false]].forEach(([label, value]) => {
                const optLabel = document.createElement('label');
                optLabel.className = "me-3";

                const input = document.createElement('input');
                input.type = "radio";
                input.name = `vf-${ex.id}-${aIndex}`;
                input.className = "me-1";

                optLabel.appendChild(input);
                optLabel.appendChild(document.createTextNode(label));
                optsWrapper.appendChild(optLabel);
                inputs[String(value)] = input;
            });
            wrapper.appendChild(optsWrapper);

            container.appendChild(wrapper);
            groups.push({ wrapper, inputs, correta: afirmacao.correta });
        });

        const btn = document.createElement('button');
        btn.className = "btn btn-coral mt-3";
        btn.innerText = "Verificar Respostas";
        btn.onclick = () => {
            let corretas = 0;
            groups.forEach(group => {
                const selected = Object.entries(group.inputs).find(([, input]) => input.checked);
                if (!selected) return;
                const [value] = selected;
                const acertou = value === String(group.correta);
                group.wrapper.style.color = acertou ? "var(--color-primary)" : "var(--color-error)";
                if (acertou) corretas++;
            });
            const total = groups.length || 1;
            const percentual = Math.round((corretas / total) * 100);
            const respostas = groups.map(group => {
                const selected = Object.entries(group.inputs).find(([, input]) => input.checked);
                return selected ? selected[0] === 'true' : null;
            });
            btn.innerText = "Verificar novamente";
            registrarResultadoLocal(ex, { percentual, pontuacao: percentual, tempoInicio, respostas: { valores: respostas } });
        };
        container.appendChild(btn);
    }
};

document.addEventListener("DOMContentLoaded", function() {
    const dataElement = document.getElementById('exercicios-data');
    if (!dataElement) return;

    let exerciciosData = [];
    try {
        exerciciosData = JSON.parse(dataElement.textContent);
    } catch (e) {
        console.error("Erro ao fazer parse dos dados dos exercícios:", e);
        return;
    }

    const container = document.getElementById('exercicios-container');
    if (exerciciosData.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhum exercício configurado para esta sessão.</div>`;
        return;
    }

    container.innerHTML = '';

    exerciciosData.forEach(ex => {
        const card = document.createElement('div');
        card.className = "card card-item exercicio-card p-4 p-md-5 mb-4";
        card.id = `exercicio-card-${ex.id}`;
        cardsPorExercicioId[ex.id] = card;

        const icone = document.createElement('div');
        icone.className = "exercicio-icone";
        icone.innerHTML = `<span class="material-symbols-outlined icon-fill" style="font-size:32px;">${ (ex.icone || 'quiz') }</span>`;

        const numeroLabel = document.createElement('p');
        numeroLabel.className = "text-muted small mb-1 text-center";
        numeroLabel.innerText = `Exercício ${ex.numero} de ${exerciciosData.length}`;

        const title = document.createElement('h4');
        title.innerText = ex.enunciado;

        const tipoLabel = document.createElement('p');
        tipoLabel.className = "text-muted enunciado-texto small";
        tipoLabel.innerText = ex.tipo.replace(/_/g, ' ');

        const corpoExercicio = document.createElement('div');
        corpoExercicio.id = `exercicio-corpo-${ex.id}`;

        card.appendChild(icone);
        card.appendChild(numeroLabel);
        card.appendChild(title);
        card.appendChild(tipoLabel);
        card.appendChild(corpoExercicio);

        container.appendChild(card);

        if (ExerciseRenderers[ex.tipo]) {
            ExerciseRenderers[ex.tipo](corpoExercicio, ex);
        } else {
            corpoExercicio.innerHTML = `<div class="alert alert-warning">Renderizador não implementado para o tipo: ${ex.tipo}</div>`;
            criarBotaoVoltar(corpoExercicio);
        }
    });

    atualizarProgresso();

    const btnEnviar = document.getElementById('btn-enviar-sessao');
    const avisoErros = document.getElementById('aviso-erros');
    if (btnEnviar) {
        btnEnviar.disabled = false;
        btnEnviar.onclick = () => {
            const sessaoId = container.dataset.sessaoId;
            const resultados = exerciciosData.map(ex => resultadosLocais[ex.id] || {
                exercicio_id: ex.id,
                percentual_acerto: 0,
                pontuacao: 0,
                tempo_segundos: 0,
                tentativas: 0,
                respostas: {},
            });

            btnEnviar.disabled = true;
            fetch(`/sessoes/${sessaoId}/enviar/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ resultados }),
            }).then(resp => resp.json()).then(data => {
                btnEnviar.disabled = false;
                if (data && data.concluida && data.proxima_url) {
                    window.location.href = data.proxima_url;
                    return;
                }
                if (avisoErros) avisoErros.style.display = 'flex';
                if (data && data.primeiro_erro_exercicio_id) {
                    const cardComErro = cardsPorExercicioId[data.primeiro_erro_exercicio_id];
                    if (cardComErro) {
                        cardComErro.classList.add('com-erro');
                        cardComErro.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }).catch(err => {
                console.error('Erro ao enviar sessão', err);
                btnEnviar.disabled = false;
            });
        };
    }
});
</script>
