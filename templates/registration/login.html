<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <title>Login - Projeto LB</title>
    <style>
        :root {
            --color-primary: #246A51;
            --color-bg: #F9F9F7;
            --color-surface: #FFFFFF;
            --color-border: #E2E3E1;
            --color-text: #1A1C1B;
            --radius-lg: 1rem;
            --shadow-card: 0 4px 14px rgba(0,0,0,0.08);
        }
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Nunito Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: var(--color-surface);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            font-family: 'Quicksand', sans-serif;
            color: var(--color-primary);
            font-weight: 700;
        }
        .btn-primary {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            font-family: 'Nunito Sans', sans-serif;
            font-weight: 700;
            padding: 12px;
            font-size: 18px;
        }
        .btn-primary:hover {
            background-color: #1e5a44;
            border-color: #1e5a44;
        }
        .form-control {
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h2 class="mb-4">Bem-vindo(a)</h2>
    
    {% if form.errors %}
        <div class="alert alert-danger">
            Usuário ou senha inválidos. Tente novamente.
        </div>
    {% endif %}
    
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <label for="id_username" class="form-label fw-bold">Usuário</label>
            <input type="text" name="username" class="form-control" id="id_username" required autofocus>
        </div>
        <div class="mb-4 text-start">
            <label for="id_password" class="form-label fw-bold">Senha</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
</div>

</body>
</html>
