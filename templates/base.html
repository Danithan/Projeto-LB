<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}Projeto LB{% endblock %}</title>
    <style>
        :root {
            /* Paleta — docs/design-system.md */
            --color-primary: #2D6E7E;
            --color-primary-strong: #245A67;
            --color-accent: #FF6F61;
            --color-accent-hover: #E85C4F;
            --color-bg: #F5F9FA;
            --color-surface: #FFFFFF;
            --color-text: #1F3A40;
            --color-text-muted: #5C7A82;
            --color-border: rgba(45, 110, 126, 0.16);

            /* Raio — moderado, cards vs. botões de ação */
            --radius-card: 12px;
            --radius-control: 8px;
            --radius-pill: 50px;

            /* Profundidade — sombra suave nos cards, sem sombra nos inputs */
            --shadow-card: 0 4px 14px rgba(0,0,0,0.08);
            --shadow-card-hover: 0 10px 24px rgba(0,0,0,0.14);

            --bs-focus-ring-color: rgba(45, 110, 126, 0.25);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 {
            color: var(--color-primary);
            letter-spacing: -0.01em;
        }
        a {
            color: var(--color-primary);
        }
        .text-muted {
            color: var(--color-text-muted) !important;
        }

        /* Cards de conteúdo: sombra suave, sem borda (Padrão: Card de item) */
        .card-item {
            border: none;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            transition: transform 0.15s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.15s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        /* Avatar circular */
        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Botões — pílula, alvo de toque generoso (uso em tablet) */
        .btn {
            border-radius: var(--radius-pill);
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-sm {
            min-height: 40px;
        }

        /* Botão primário (criar/salvar) — cor de destaque coral */
        .btn-coral {
            background-color: var(--color-accent);
            border-color: var(--color-accent);
            color: white;
        }
        .btn-coral:hover {
            background-color: var(--color-accent-hover);
            border-color: var(--color-accent-hover);
            color: white;
        }

        /* Botões secundários (editar/cancelar) — outline, formato pílula */
        .btn-outline-primary {
            color: var(--color-primary);
            border-color: var(--color-primary);
        }
        .btn-outline-primary:hover {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
        }

        /* Elementos de formulário: borda sólida, sem sombra — foco em clareza */
        .form-control,
        .form-select {
            border-radius: var(--radius-control);
            border: 1px solid rgba(45, 110, 126, 0.28);
            padding: 0.6rem 0.85rem;
            min-height: 44px;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(45, 110, 126, 0.18);
        }
        input[type="date"].form-control {
            cursor: pointer;
        }
        .form-label {
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 0.4rem;
        }
        .form-text {
            color: var(--color-text-muted);
        }
        .form-errors {
            list-style: none;
            padding: 0;
            margin: 0.4rem 0 0;
            color: #C0392B;
            font-size: 0.875rem;
        }
        .form-field {
            margin-bottom: 1.5rem;
        }

        /* Estado vazio */
        .empty-state {
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-card);
            padding: 3rem 2rem;
            text-align: center;
            color: var(--color-text-muted);
        }

        a:focus-visible,
        button:focus-visible,
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 110, 126, 0.35);
        }
    </style>
    <style>
        .app-nav {
            background-color: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0.9rem 0;
        }
        .app-nav a {
            text-decoration: none;
            font-weight: 600;
        }
        .app-nav .brand {
            color: var(--color-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <nav class="app-nav">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-4">
                <a href="{% if user.is_authenticated %}{% url 'crianca_lista' %}{% else %}{% url 'home' %}{% endif %}" class="brand">Projeto LB</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'crianca_lista' %}" class="text-muted">Crianças</a>
                {% endif %}
            </div>
            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-3">
                    <span class="text-muted small">{{ user.get_full_name|default:user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-primary btn-sm">Sair</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </nav>
    <div class="container my-5">
        {% block conteudo %}
        {% endblock %}
    </div>
</body>
</html>
