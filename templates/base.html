<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}Projeto LB{% endblock %}</title>
    <style>
        body {
            background-color: #F5F9FA;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        h1, h2, h3 {
            color: #2D6E7E;
        }
        a {
            color: #2D6E7E;
        }

        /* Cards de conteúdo: sombra suave, sem borda (Padrão: Card de item) */
        .card-item {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.14);
        }

        /* Avatar circular */
        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #FF6F61;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Botão primário (criar/salvar) — cor de destaque coral */
        .btn-coral {
            background-color: #FF6F61;
            border-color: #FF6F61;
            color: white;
            border-radius: 50px;
        }
        .btn-coral:hover {
            background-color: #e85c4f;
            border-color: #e85c4f;
            color: white;
        }

        /* Botões secundários (editar/cancelar) — outline, formato pílula */
        .btn-outline-primary {
            color: #2D6E7E;
            border-color: #2D6E7E;
            border-radius: 50px;
        }
        .btn-outline-primary:hover {
            background-color: #2D6E7E;
            border-color: #2D6E7E;
        }
        .btn-outline-secondary,
        .btn-outline-danger,
        .btn-danger {
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div class="container my-5">
        {% block conteudo %}
        {% endblock %}
    </div>
</body>
</html>
