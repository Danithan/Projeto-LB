<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <title>{% block title %}Projeto LB{% endblock %}</title>
    <style>
        :root {
            /* Paleta — DESIGN.md */
            --color-primary: #246A51;
            --color-primary-container: #6BAF92;
            --color-on-primary-container: #00412E;
            --color-secondary: #356287;
            --color-secondary-container: #A8D3FE;
            --color-tertiary: #63578A;
            --color-tertiary-container: #A89AD2;
            --color-bg: #F9F9F7;
            --color-surface: #FFFFFF;
            --color-surface-dim: #DADAD8;
            --color-surface-container: #EEEEEC;
            --color-text: #1A1C1B;
            --color-text-muted: #3F4944;
            --color-border: #E2E3E1;

            /* Raio */
            --radius-sm: 0.25rem;
            --radius-md: 0.5rem;
            --radius-lg: 1rem;
            --radius-pill: 9999px;

            /* Profundidade — "Soft Outlines" and tonal layers rather than drop shadows */
            --shadow-card: 0 0 0 1px var(--color-border);
            --shadow-card-hover: 0 4px 14px rgba(0,0,0,0.08);

            --bs-focus-ring-color: rgba(53, 98, 135, 0.25);
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: 'Nunito Sans', system-ui, sans-serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5, h6, .brand {
            font-family: 'Quicksand', sans-serif;
            color: var(--color-text);
            letter-spacing: -0.02em;
        }
        h1 { font-size: 40px; font-weight: 700; }
        h2 { font-size: 32px; font-weight: 600; }
        h3 { font-size: 20px; font-weight: 600; }
        
        a {
            color: var(--color-primary);
        }
        .text-muted {
            color: var(--color-text-muted) !important;
        }

        /* Cards de conteúdo: sombra suave, sem borda (Padrão: Card de item) */
        .card-item {
            background-color: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: 24px;
            transition: transform 0.15s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.15s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }

        /* Avatar circular */
        .avatar-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--color-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--color-on-primary-container);
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Botões — pílula, alvo de toque generoso (uso em tablet) */
        .btn {
            border-radius: var(--radius-md);
            min-height: 48px;
            font-family: 'Nunito Sans', sans-serif;
            font-size: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-sm {
            min-height: 40px;
            font-size: 16px;
        }

        /* Botão primário (Mint Green) */
        .btn-coral, .btn-primary {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }
        .btn-coral:hover, .btn-primary:hover {
            background-color: #1e5a44;
            border-color: #1e5a44;
            color: white;
        }

        /* Botões secundários — outline */
        .btn-outline-primary {
            color: var(--color-text);
            border-color: var(--color-border);
            border-width: 2px;
        }
        .btn-outline-primary:hover {
            background-color: var(--color-surface-container);
            border-color: var(--color-border);
            color: var(--color-text);
        }

        /* Elementos de formulário: borda sólida, sem sombra — foco em clareza */
        .form-control,
        .form-select {
            border-radius: var(--radius-md);
            border: 2px solid var(--color-border);
            padding: 0.6rem 0.85rem;
            min-height: 48px;
            font-size: 18px;
            font-family: 'Nunito Sans', sans-serif;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--color-secondary);
            box-shadow: 0 0 0 3px rgba(53, 98, 135, 0.18);
        }
        input[type="date"].form-control {
            cursor: pointer;
        }
        .form-label {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--color-text);
            margin-bottom: 0.4rem;
        }
        .form-text {
            color: var(--color-text-muted);
        }
        .form-errors {
            list-style: none;
            padding: 0;
            margin: 0.4rem 0 0;
            color: #ba1a1a;
            font-size: 0.875rem;
        }
        .form-field {
            margin-bottom: 1.5rem;
        }

        /* Estado vazio */
        .empty-state {
            border: 2px dashed var(--color-border);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            background-color: var(--color-surface-container);
            color: var(--color-text-muted);
        }

        a:focus-visible,
        button:focus-visible,
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(36, 106, 81, 0.35);
        }
        
        /* Status Tags */
        .badge {
            font-family: 'Nunito Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.5em 0.8em;
            border-radius: var(--radius-pill);
        }
    </style>
    <style>
        .app-nav {
            background-color: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 0.9rem 0;
        }
        .app-nav a {
            text-decoration: none;
            font-weight: 600;
        }
        .app-nav .brand {
            color: var(--color-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <nav class="app-nav">
        <div class="container d-flex align-items-center gap-4">
            <a href="{% url 'crianca_lista' %}" class="brand">Projeto LB</a>
            <a href="{% url 'crianca_lista' %}" class="text-muted">Crianças</a>
        </div>
    </nav>
    <div class="container my-5">
        {% block conteudo %}
        {% endblock %}
    </div>
</body>
</html>
