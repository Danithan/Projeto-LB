{% extends 'base.html' %}

{% block conteudo %}
<h1 class="fw-bold mb-4">Cadastro de criança</h1>
<div class="card card-item p-4" style="max-width: 480px;">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-coral px-4">Salvar</button>
            <a href="{% url 'crianca_lista' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
